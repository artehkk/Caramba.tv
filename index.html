<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarambaTV.RU</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: #0b0b0b;
        background-image: 
            linear-gradient(45deg, #0d0d0d 25%, transparent 25%, transparent 75%, #0d0d0d 75%, #0d0d0d),
            linear-gradient(45deg, #0d0d0d 25%, transparent 25%, transparent 75%, #0d0d0d 75%, #0d0d0d);
        background-size: 10px 10px;
        background-position: 0 0, 5px 5px;
        color: #ddd;
        font-family: Arial, sans-serif;
        min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }

    .yt-topbar {
        background: #161616;
        border-bottom: 2px solid #2a2a2a;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }
    .logo-left { font-family: 'Impact', sans-serif; font-size: 28px; color: #fff; cursor: pointer; }
    .logo-left span { color: #cc181e; }
    .nav-links-center { display: flex; gap: 15px; flex-wrap: wrap; }
    .nav-links-center a {
        font-size: 13px;
        font-weight: bold;
        color: #aaa;
        cursor: pointer;
        padding: 4px 12px;
        border-radius: 3px;
    }
    .nav-links-center a:hover { color: #fff; background: #2a2a2a; }
    .nav-links-center a.active { color: #cc181e; background: #222; }
    .top-controls-right { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
    
    .yt-search { display: flex; background: #0d0d0d; border: 1px solid #333; padding: 2px; border-radius: 2px; }
    .yt-search input { background: transparent; border: none; outline: none; padding: 5px 10px; color: #ccc; font-size: 13px; width: 150px; }
    .yt-search button { background: #222; border: none; border-left: 1px solid #333; padding: 0 15px; cursor: pointer; color: #888; font-weight: bold; }

    .lang-select {
        background: #333;
        color: #fff;
        border: 1px solid #555;
        padding: 4px 8px;
        border-radius: 3px;
        font-size: 12px;
        cursor: pointer;
    }
    .lang-select:focus { outline: none; border-color: #cc181e; }

    .btn-soft {
        background: linear-gradient(to bottom, #555, #333);
        border: 1px solid #444;
        padding: 6px 16px;
        color: #fff;
        font-weight: bold;
        font-size: 13px;
        cursor: pointer;
        border-radius: 2px;
    }
    .btn-soft:hover { background: linear-gradient(to bottom, #666, #444); }

    .auth-top-btn {
        background: #cc181e;
        border: none;
        padding: 6px 16px;
        color: #fff;
        font-weight: bold;
        font-size: 13px;
        cursor: pointer;
        border-radius: 2px;
    }
    .auth-top-btn:hover { background: #a01016; }

    .logout-btn {
        background: #444;
        border: none;
        padding: 6px 16px;
        color: #fff;
        font-weight: bold;
        font-size: 13px;
        cursor: pointer;
        border-radius: 2px;
        display: none;
    }

    .sync-btn {
        background: linear-gradient(to bottom, #2d8a4e, #1a5c33);
        border: 1px solid #3a9e5a;
        padding: 6px 16px;
        color: #fff;
        font-weight: bold;
        font-size: 13px;
        cursor: pointer;
        border-radius: 2px;
    }
    .sync-btn:hover { background: linear-gradient(to bottom, #3a9e5a, #2d8a4e); }
    .sync-btn.syncing { opacity: 0.6; pointer-events: none; }

    #homeSection, #playerSection, #gifPlayerSection, #imagePlayerSection, #videoOfDaySection {
        max-width: 1150px;
        margin: 25px auto;
        padding: 0 15px;
    }
    #homeSection { display: block; }
    #playerSection { display: none; }
    #gifPlayerSection { display: none; }
    #imagePlayerSection { display: none; }
    #videoOfDaySection { display: none; }

    .home-grid, .gif-grid, .image-grid {
        display: grid;
        gap: 20px;
        min-height: 300px;
        padding: 0 15px 20px 15px;
        max-width: 1150px;
        margin: 0 auto;
    }
    .home-card {
        background: #131313;
        border: 1px solid #252525;
        border-radius: 4px;
        overflow: hidden;
        cursor: pointer;
        position: relative;
    }
    .home-card:hover { border-color: #cc181e; transform: scale(1.02); }
    .home-card img {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        display: block;
        border-bottom: 1px solid #222;
    }
    .home-info { padding: 12px; }
    .home-title {
        font-weight: bold;
        font-size: 15px;
        color: #f1f1f1;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .home-tags { font-size: 11px; color: #3b8bd6; margin-top: 4px; display: block; }
    .home-time { font-size: 11px; color: #666; margin-top: 2px; display: block; }
    .home-views { font-size: 12px; color: #777; }
    .home-author { font-size: 12px; color: #3b8bd6; margin-top: 2px; display: block; }

    .gif-card {
        background: #131313;
        border: 1px solid #252525;
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        cursor: pointer;
    }
    .gif-card:hover { border-color: #3b8bd6; transform: scale(1.02); }
    .gif-card img {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        display: block;
        border-bottom: 1px solid #222;
    }
    .gif-info { padding: 12px; }
    .gif-title {
        font-weight: bold;
        font-size: 14px;
        color: #f1f1f1;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .image-card {
        background: #131313;
        border: 1px solid #252525;
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        cursor: pointer;
    }
    .image-card:hover { border-color: #3b8bd6; transform: scale(1.02); }
    .image-card img {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        display: block;
        border-bottom: 1px solid #222;
    }
    .image-info { padding: 12px; }
    .image-title {
        font-weight: bold;
        font-size: 14px;
        color: #f1f1f1;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .delete-btn {
        position: absolute;
        top: 5px;
        right: 5px;
        background: #cc181e;
        color: #fff;
        border: none;
        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;
        border-radius: 3px;
        display: none;
        z-index: 10;
        font-weight: bold;
    }
    .delete-btn:hover { background: #a01016; }

    .poll-card {
        background: #131313;
        border: 1px solid #ffcc00;
        border-radius: 4px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .poll-card h3 { color: #ffcc00; margin: 0 0 10px 0; font-size: 18px; }
    .poll-card label { display: block; margin: 5px 0; color: #ccc; font-size: 14px; cursor: pointer; }
    .poll-card button {
        background: #cc181e;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 3px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }
    .poll-card .result { color: #aaa; font-size: 13px; margin-top: 10px; }

    .empty-message {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        background: #131313;
        border: 1px solid #252525;
        border-radius: 4px;
        color: #888;
    }
    .empty-message h2 { color: #cc181e; margin-bottom: 10px; }

    .player-container {
        background: #131313;
        border: 1px solid #252525;
        padding: 20px;
        border-radius: 4px;
    }
    .player-wrapper {
        width: 100%;
        background: #000;
        aspect-ratio: 16 / 9;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 2px;
        position: relative;
    }
    #mainPlayer, #rutubePlayer {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
        border: none;
        object-fit: contain;
    }
    #gifPlayer, #imagePlayer {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        background: #000;
    }

    .video-title {
        font-size: 22px;
        font-weight: bold;
        color: #f1f1f1;
        margin: 15px 0 10px 0;
    }
    
    .video-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #2a2a2a;
        border-bottom: 1px solid #2a2a2a;
        padding: 12px 0;
        flex-wrap: wrap;
        gap: 15px;
    }
    .video-author {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: #aaa;
    }
    .video-author strong { color: #f1f1f1; }
    .sub-btn {
        background: #cc181e;
        color: #fff;
        border: 1px solid #a01016;
        padding: 4px 14px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 2px;
        font-size: 12px;
        text-transform: uppercase;
    }
    .sub-btn.subscribed { background: #555; border-color: #444; }
    .video-stats {
        font-size: 13px;
        color: #999;
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
    }
    .like-btn {
        background: transparent;
        border: none;
        color: #999;
        cursor: pointer;
        font-weight: bold;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 4px 8px;
        border-radius: 4px;
        transition: 0.2s;
    }
    .like-btn:hover { color: #3b8bd6; background: rgba(59,139,214,0.1); }
    .like-btn.liked { color: #3b8bd6; }

    .comment-section { margin-top: 25px; border-top: 1px solid #2a2a2a; padding-top: 15px; }
    .comment-section h4 { color: #f1f1f1; margin: 0 0 12px 0; font-size: 16px; }
    .comment-input-box { display: flex; gap: 10px; margin-bottom: 15px; }
    .comment-input-box input {
        flex: 1;
        padding: 8px 12px;
        background: #0d0d0d;
        border: 1px solid #333;
        color: #fff;
        border-radius: 2px;
        font-size: 14px;
    }
    .comment-input-box input:focus { outline: none; border-color: #cc181e; }
    .comment-input-box button {
        background: #cc181e;
        color: white;
        border: none;
        padding: 8px 18px;
        cursor: pointer;
        border-radius: 2px;
        font-weight: bold;
    }
    .comment-input-box button:hover { background: #a01016; }
    .comment-list { display: flex; flex-direction: column; gap: 8px; }
    .comment-item {
        background: #0d0d0d;
        border: 1px solid #222;
        padding: 10px;
        border-radius: 2px;
    }
    .comment-item .user { color: #3b8bd6; font-weight: bold; font-size: 13px; }
    .comment-item .date { color: #666; font-size: 11px; margin-left: 10px; }
    .comment-item .text { margin-top: 4px; color: #ccc; font-size: 14px; word-break: break-word; }

    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        padding: 20px;
    }
    .modal-box {
        background: #1a1a1a;
        border: 2px solid #333;
        padding: 30px;
        width: 340px;
        max-width: 100%;
        border-radius: 4px;
        text-align: center;
        max-height: 90vh;
        overflow-y: auto;
    }
    .modal-box h3 { color: #fff; margin-top: 0; font-size: 18px; }
    .modal-input {
        width: 90%;
        padding: 10px;
        margin: 8px 0;
        background: #0d0d0d;
        color: #fff;
        border: 1px solid #444;
        border-radius: 2px;
        box-sizing: border-box;
    }
    .modal-input:focus { outline: none; border-color: #cc181e; }
    .modal-btn {
        background: #cc181e;
        color: white;
        border: none;
        padding: 10px;
        width: 90%;
        cursor: pointer;
        font-weight: bold;
        border-radius: 2px;
        margin-top: 5px;
    }
    .modal-btn:hover { background: #a01016; }
    .modal-close { display: block; margin-top: 15px; color: #666; font-size: 13px; cursor: pointer; }
    .modal-close:hover { color: #999; }

    .footer {
        max-width: 1150px;
        margin: 30px auto 20px auto;
        padding: 20px 15px;
        text-align: center;
        border-top: 1px solid #252525;
        color: #555;
        font-size: 13px;
        line-height: 1.6;
    }
    .footer strong { color: #888; }
    .footer .highlight { color: #cc181e; font-weight: bold; }

    @media (max-width: 599px) {
        .yt-topbar { flex-direction: column; align-items: stretch; gap: 10px; padding: 10px; }
        .logo-left { text-align: center; font-size: 24px; }
        .nav-links-center { justify-content: center; flex-wrap: wrap; gap: 5px; }
        .nav-links-center a { font-size: 11px; padding: 3px 8px; }
        .top-controls-right { flex-direction: column; gap: 10px; align-items: stretch; }
        .yt-search { width: 100%; }
        .yt-search input { width: 100%; }
        .auth-top-btn, .logout-btn, .btn-soft, .sync-btn { width: 100%; text-align: center; }
        .home-grid, .gif-grid, .image-grid { grid-template-columns: 1fr; gap: 15px; padding: 0 10px 15px 10px; }
        .home-title { font-size: 14px; }
        .video-title { font-size: 18px; }
        .player-wrapper { aspect-ratio: 16/9; }
        .modal-box { width: 95%; padding: 20px; }
        .modal-input { width: 100%; padding: 12px; font-size: 16px; }
        .modal-btn { width: 100%; padding: 12px; font-size: 16px; }
        .comment-section h4 { font-size: 14px; }
        .comment-input-box { flex-direction: column; gap: 8px; }
        .comment-input-box input { width: 100%; padding: 12px; font-size: 16px; }
        .comment-input-box button { width: 100%; padding: 12px; }
        .video-meta { flex-direction: column; align-items: stretch; }
        .video-author { flex-wrap: wrap; }
        .video-stats { flex-wrap: wrap; }
    }

    @media (min-width: 600px) and (max-width: 1023px) {
        .yt-topbar { flex-direction: row; flex-wrap: wrap; gap: 10px; }
        .logo-left { font-size: 26px; }
        .nav-links-center { flex-wrap: wrap; justify-content: center; gap: 8px; }
        .nav-links-center a { font-size: 12px; }
        .top-controls-right { flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
        .home-grid, .gif-grid, .image-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .video-title { font-size: 20px; }
        .player-wrapper { aspect-ratio: 16/9; }
        .modal-box { width: 80%; max-width: 400px; }
        .comment-input-box input { font-size: 15px; }
    }

    @media (min-width: 1024px) {
        .home-grid, .gif-grid, .image-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .yt-topbar { flex-direction: row; }
        .logo-left { font-size: 28px; }
        .nav-links-center a { font-size: 13px; }
    }
</style>
</head>
<body>
    <!-- ВЕСЬ HTML КАК РАНЬШЕ -->
    <div class="yt-topbar">
        <div class="logo-left" onclick="goHome()">Caramba<span>TV</span>.RU</div>
        <div class="nav-links-center">
            <a class="active" onclick="goHome()" id="navVideos">Видео</a>
            <a onclick="filterCategory('50')" id="navIssues">Выпуски +-50</a>
            <a onclick="filterCategory('опрос')" id="navPolls">Опросы</a>
            <a onclick="showGifs()" id="navGifs">Гифки</a>
            <a onclick="showImages()" id="navImages">Картинки</a>
            <a onclick="showVideoOfDay()" id="navVideoOfDay">Видео дня</a>
        </div>
        <div class="top-controls-right">
            <div class="yt-search">
                <input type="text" id="searchInput" placeholder="Поиск..." onkeypress="if(event.key==='Enter') handleSearch()">
                <button onclick="handleSearch()">🔍</button>
            </div>
            <select class="lang-select" id="langSelect" onchange="switchLang()">
                <option value="ru">РУС</option>
                <option value="en">ENG</option>
            </select>
            <button class="btn-soft" onclick="openRulesModal()">📜 Правила</button>
            <button class="btn-soft" onclick="openUploadModal()">📤 Загрузить</button>
            <button class="sync-btn" onclick="syncWithGitHub()" id="syncBtn">🔄 Синхронизировать</button>
            <button class="auth-top-btn" id="loginBtn" onclick="openModal('login')" data-key="login">Вход</button>
            <button class="logout-btn" id="logoutBtn" onclick="logoutUser()" data-key="logout">Выход</button>
            <span id="userDisplay" style="display:none; color:#3b8bd6; font-weight:bold; font-size:13px; cursor:pointer;">Гость</span>
        </div>
    </div>

    <div id="homeSection">
        <div class="home-grid" id="videoGrid"></div>
    </div>

    <div id="gifSection">
        <div class="gif-grid" id="gifGrid"></div>
    </div>

    <div id="imageSection">
        <div class="image-grid" id="imageGrid"></div>
    </div>

    <div id="videoOfDaySection">
        <div class="home-grid" id="videoOfDayGrid"></div>
    </div>

    <!-- ПЛЕЕРЫ И МОДАЛКИ ТУТ ЖЕ... -->

    <div class="footer">
        <strong id="footerRights">Все права принадлежат CarambaTV.RU</strong><br>
        <span class="highlight" id="footerAnnounce">📢 Релиз для пользователей состоится 20 июля! 🎂</span>
    </div>

<script>
// ВЕСЬ JS КАК РАНЬШЕ (КОПИРУЙ С ПРЕДЫДУЩЕГО СООБЩЕНИЯ)
console.log("🚀 CarambaTV работает!");
</script>
</body>
</html>
